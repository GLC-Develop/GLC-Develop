<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP-Wisp | Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 p-5 text-white shadow-xl">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="font-bold text-xl tracking-tight">👑 Panel Administrativo</span>
            <div class="flex gap-4 text-sm">
                <a href="/pos.html" class="hover:text-blue-400">Ir a Cobros</a>
                <a href="/tecnico.html" class="hover:text-blue-400">Panel Técnico</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 space-y-8">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
            <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold flex items-center gap-2">💰 Auditoría de Cajas</h2>
                <button onclick="cargarResumenCajas()" class="bg-blue-600 px-3 py-1 rounded text-xs hover:bg-blue-500">Actualizar</button>
            </div>
            <div id="listaCajas" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-blue-600 text-white p-6 rounded-2xl shadow-lg">
                <p class="text-blue-100 text-xs uppercase font-bold">Ventas hoy</p>
                <h3 class="text-3xl font-bold mt-2" id="ventasHoy">$0.00</h3>
            </div>
            </div>
    </main>

    <script>
        async function cargarResumenCajas() {
            const res = await fetch('/api/reporte-liquidaciones');
            const resumen = await res.json();
            const contenedor = document.getElementById('listaCajas');
            contenedor.innerHTML = '';

            resumen.forEach(c => {
                const div = document.createElement('div');
                div.className = "p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-700">Punto: ${c.cobrador_id}</p>
                        <p class="text-xs text-slate-500">${c.cantidad_pagos} tickets por entregar</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-blue-700">$${c.total.toFixed(2)}</p>
                        <button onclick="liquidarCaja(${c.cobrador_id}, ${c.total})" 
                                class="mt-1 text-[10px] bg-blue-600 text-white px-3 py-1 rounded-full uppercase font-bold hover:bg-blue-700">
                            Hacer Corte
                        </button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        async function liquidarCaja(id, totalEsperado) {
            const monto = prompt(`¿Monto entregado por el Punto ${id}?`, totalEsperado);
            if (monto !== null) {
                const res = await fetch('/api/liquidar-caja', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        cobradorId: id, 
                        montoEntregado: parseFloat(monto),
                        observaciones: "Cierre desde Panel Admin"
                    })
                });
                const data = await res.json();
                alert(data.mensaje);
                cargarResumenCajas();
            }
        }

        window.onload = cargarResumenCajas;
    </script>
</body>
</html>
