<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC-Connecting | Terminal POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .card-neo { @apply bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold" id="inicialUsuario">U</div>
            <div class="text-xs">
                <p class="font-bold text-blue-400" id="displayNombre">Cargando...</p>
                <p class="opacity-50" id="displaySesion">Sesión #0</p>
            </div>
        </div>
        <button onclick="cerrarSesion()" class="bg-slate-800 px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-red-900/40 transition-all">SALIR 🔒</button>
    </nav>

    <main class="max-w-5xl mx-auto p-4 lg:p-8 space-y-6">
        
        <div class="card-neo p-6 bg-slate-900 border-none shadow-blue-900/20">
            <div class="flex gap-3">
                <input type="text" id="inputBusqueda" placeholder="Buscar por Nombre, IP o ID..." 
                       onkeypress="if(event.key==='Enter') buscar()"
                       class="flex-1 bg-slate-800 border-none text-white rounded-2xl px-6 py-4 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <button onclick="buscar()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 rounded-2xl font-bold transition-all active:scale-95">BUSCAR</button>
            </div>
        </div>

        <div id="resultados" class="space-y-4"></div>

        <div id="areaTrabajo" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="space-y-6">
                <div class="card-neo p-8">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Información del Cliente</h2>
                    <div id="infoCliente"></div>
                </div>

                <div class="card-neo p-8">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Últimos Pagos Registrados</h2>
                    <div id="historialPagos" class="space-y-3"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="card-neo p-8 border-2 border-blue-100">
                    <h2 class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] mb-6">Calculadora de Abono</h2>
                    
                    <div class="space-y-6">
                        <div class="bg-slate-50 p-6 rounded-3xl">
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Monto a recibir</label>
                            <input type="number" id="montoAbono" oninput="calcularMeses()"
                                   class="w-full bg-transparent text-4xl font-black text-slate-800 outline-none mt-2">
                        </div>

                        <div id="feedbackCobro" class="p-6 rounded-3xl bg-blue-50 border border-blue-100 flex items-center justify-between">
                            <div>
                                <p class="text-[10px] font-bold text-blue-400 uppercase">Meses a cubrir</p>
                                <p class="text-2xl font-black text-blue-700" id="labelMeses">0 meses</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-bold text-blue-400 uppercase">Costo Mensual</p>
                                <p class="text-lg font-bold text-slate-600" id="labelCostoUnitario">$0.00</p>
                            </div>
                        </div>

                        <button onclick="confirmarYProcesar()" id="btnCobrar"
                                class="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black uppercase tracking-widest hover:bg-blue-600 transition-all shadow-xl shadow-blue-900/20 active:scale-95">
                            Registrar Abono
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="modalTicket" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[3rem] shadow-2xl p-8">
            <div id="detalleTicket"></div>
            <button onclick="cerrarTicket()" class="w-full mt-6 bg-slate-100 py-4 rounded-2xl font-bold">Cerrar</button>
        </div>
    </div>

    <script>
        let clienteActual = null;
        let costoMensualGlobal = 0;

        window.onload = () => {
            const nombre = localStorage.getItem('usuario_nombre');
            const sesionId = localStorage.getItem('sesion_id');
            if (!nombre || !sesionId) window.location.href = "/login.html";
            
            document.getElementById('displayNombre').innerText = nombre;
            document.getElementById('displaySesion').innerText = "Sesión: #" + sesionId;
            document.getElementById('inicialUsuario').innerText = nombre.charAt(0);
        };

        async function buscar() {
    const criterio = document.getElementById('inputBusqueda').value;
    const contenedorResultados = document.getElementById('resultados');
    const areaTrabajo = document.getElementById('areaTrabajo');

    // 1. Limpieza total antes de empezar
    areaTrabajo.classList.add('hidden');
    contenedorResultados.innerHTML = '';

    if (!criterio.trim()) return;

    try {
        const res = await fetch(`/api/buscar?criterio=${criterio}`);
        
        // Si el servidor responde con error (404, 500, etc)
        if (!res.ok) {
            throw new Error("Servidor no disponible");
        }

        const clientes = await res.json();

        // 2. Si hay clientes, procesamos el primero
        if (clientes && clientes.length > 0) {
            const c = clientes[0]; 
            
            // Verificación de seguridad: ¿Tiene domicilios y servicios?
            if (!c.domicilios?.[0]?.servicios?.[0]) {
                contenedorResultados.innerHTML = `
                    <div class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded-xl text-yellow-700 text-sm">
                        ⚠️ Cliente encontrado pero no tiene un servicio de internet asignado.
                    </div>`;
                return;
            }

            clienteActual = c;
            costoMensualGlobal = Number(c.domicilios[0].servicios[0].precio_mensual);
            
            areaTrabajo.classList.remove('hidden');
            await mostrarDatosCliente(c); // Usamos await aquí para esperar los datos de deuda
        } 
        // 3. Si NO hay clientes (Respuesta vacía del servidor [])
        else {
            contenedorResultados.innerHTML = `
                <div class="bg-orange-100 border-l-4 border-orange-500 p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">🔍</span>
                        <div>
                            <p class="font-black text-orange-800 uppercase text-xs tracking-widest">Sin coincidencias</p>
                            <p class="text-orange-700 text-sm">No encontramos ningún cliente con: <b>"${criterio}"</b></p>
                        </div>
                    </div>
                </div>`;
        }
    } catch (error) {
        console.error("Error capturado:", error);
        // Solo mostramos error de conexión si el fetch realmente falló (servidor apagado)
        contenedorResultados.innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl">
                <p class="text-red-700 text-xs font-bold uppercase">❌ Error de comunicación</p>
                <p class="text-red-600 text-sm">No se pudo contactar al servidor o hubo un error interno.</p>
            </div>`;
    }
}
        async function mostrarDatosCliente(c) {
            // Llamamos al endpoint de estado de cuenta
            const estadoRes = await fetch(`/api/clientes/${c.id}/estado-cuenta`);
            const estado = await estadoRes.json();

            document.getElementById('infoCliente').innerHTML = `
                <h3 class="text-2xl font-black text-slate-800">${c.nombre_completo}</h3>
                <p class="text-slate-500 text-sm">📍 ${c.domicilios[0].direccion_exacta}</p>
                <div class="mt-4 p-4 rounded-2xl ${estado.deudaPendiente > 0 ? 'bg-orange-50 border border-orange-100' : 'bg-blue-50 border border-blue-100'}">
                    <p class="text-[10px] font-black uppercase tracking-widest ${estado.deudaPendiente > 0 ? 'text-orange-500' : 'text-blue-500'}">
                        ${estado.deudaPendiente > 0 ? '⚠️ Pendiente de completar' : '✅ Estatus de Cuenta'}
                    </p>
                    <p class="text-sm font-bold text-slate-700">
                        ${estado.deudaPendiente > 0 
                            ? `Faltan <span class="text-orange-600">$${estado.deudaPendiente}</span> para cubrir ${estado.mesAfectado}` 
                            : `Cubierto hasta: ${estado.ultimoMesPagado}`}
                    </p>
                </div>
            `;

            document.getElementById('labelCostoUnitario').innerText = `$${costoMensualGlobal}`;
            
            // Sugerencia inteligente de monto
            if (estado.deudaPendiente > 0) {
                document.getElementById('montoAbono').value = estado.deudaPendiente;
                document.getElementById('labelMeses').innerText = "Completar mes";
            } else {
                document.getElementById('montoAbono').value = costoMensualGlobal;
                calcularMeses();
            }
            
            cargarHistorial(c.id);
        }

        async function cargarHistorial(clienteId) {
            const contenedor = document.getElementById('historialPagos');
            try {
                const res = await fetch(`/api/pagos/cliente/${clienteId}`);
                const pagos = await res.json();
                
                contenedor.innerHTML = pagos.length === 0 
                    ? `<p class="text-xs text-slate-400 italic">Sin pagos previos.</p>`
                    : pagos.map(p => `
                        <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                            <div><p class="text-[10px] font-bold text-slate-800 uppercase">${p.mes_cubierto}</p></div>
                            <div class="text-right">
                                <p class="font-bold text-blue-600">$${p.monto}</p>
                                <p class="text-[8px] text-slate-400 uppercase">${p.metodo_pago}</p>
                            </div>
                        </div>`).join('');
            } catch (err) { contenedor.innerHTML = "Error al cargar historial"; }
        }

        function calcularMeses() {
            const monto = document.getElementById('montoAbono').value;
            const meses = Math.floor(monto / costoMensualGlobal);
            const label = document.getElementById('labelMeses');
            label.innerText = meses > 0 ? `${meses} mes${meses > 1 ? 'es' : ''}` : "Monto insuficiente";
        }

        async function confirmarYProcesar() {
            const monto = document.getElementById('montoAbono').value;
            const sesionId = localStorage.getItem('sesion_id');
            if (monto <= 0) return alert("Monto no válido");

            if (!confirm(`¿Registrar abono de $${monto}?`)) return;

            const res = await fetch('/api/pagar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clienteId: clienteActual.id,
                    monto: parseFloat(monto),
                    metodo: "Efectivo",
                    sesionId: parseInt(sesionId)
                })
            });

            if (res.ok) {
                const data = await res.json();
                const pagoId = Array.isArray(data.detalle) ? data.detalle[0].id : data.detalle.id;
                mostrarTicket(pagoId);
            }
        }

        async function mostrarTicket(pagoId) {
            const res = await fetch(`/api/ticket/${pagoId}`);
            const pago = await res.json();
            document.getElementById('detalleTicket').innerHTML = `
                <p class="text-center font-bold text-lg mb-4 uppercase">${pago.cliente.nombre_completo}</p>
                <div class="space-y-2 text-sm font-mono">
                    <p class="flex justify-between"><span>Folio:</span> <b>#${pago.id}</b></p>
                    <p class="flex justify-between"><span>Total:</span> <b>$${pago.monto}</b></p>
                </div>`;
            document.getElementById('modalTicket').classList.remove('hidden');
        }

        function cerrarTicket() { location.reload(); }
        function cerrarSesion() { localStorage.clear(); window.location.href = "/login.html"; }
    </script>
</body>
</html>
