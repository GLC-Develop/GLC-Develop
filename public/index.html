<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC-Connecting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#f0f4f8] min-h-screen">
    <nav class="bg-gradient-to-r from-[#1e3a8a] to-[#3b82f6] p-5 text-white shadow-2xl sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <span class="font-bold text-xl tracking-tight flex items-center gap-2">
                <span class="bg-white/20 p-1.5 rounded-lg">📡</span> ERP-Wisp
            </span>
            <span class="text-xs bg-blue-400/30 px-2 py-1 rounded uppercase tracking-widest border border-white/20">POS v1.0</span>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <div class="bg-[#1e293b] p-6 rounded-2xl shadow-2xl border border-slate-700">
            <label class="block text-blue-300 text-xs font-bold uppercase tracking-wider mb-2">Búsqueda de Cliente</label>
            <div class="flex gap-2">
                <input type="text" id="inputBusqueda" placeholder="Nombre, IP o ID..." 
                       class="flex-1 bg-slate-800 border border-slate-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder:text-slate-500">
                <button onclick="buscar()" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg shadow-blue-900/20 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="resultados" class="space-y-4">
            </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-slate-50 border-b p-4 flex justify-between items-center">
                <h2 class="text-slate-800 font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    Control de Liquidación
                </h2>
                <button onclick="cargarResumenCajas()" class="text-blue-600 hover:rotate-180 transition-all duration-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            <div id="listaCajas" class="p-4 space-y-3">
                </div>
        </div>

    </main>

    <div id="modalTicket" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform transition-all scale-100">
            <div class="bg-blue-600 p-6 text-center text-white">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3">
                    <span class="text-3xl">📡</span>
                </div>
                <h2 class="text-xl font-bold tracking-tight">Recibo de Pago</h2>
                <p class="text-blue-100 text-xs uppercase tracking-widest mt-1">Conectividad Garantizada</p>
            </div>
            
            <div id="detalleTicket" class="p-8 font-mono text-slate-700 text-sm leading-relaxed">
                </div>

            <div class="p-6 bg-slate-50 border-t flex gap-3">
                <button onclick="cerrarTicket()" class="flex-1 bg-white border border-slate-300 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-100 transition-colors">Cerrar</button>
                <button onclick="window.print()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Imprimir</button>
            </div>
        </div>
    </div>

</body>


    <script>
	async function cargarResumenCajas() {
    const res = await fetch('/api/reporte-liquidaciones');
    const resumen = await res.json();
    const contenedor = document.getElementById('listaCajas');
    contenedor.innerHTML = '';

    resumen.forEach(c => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center p-3 bg-gray-50 rounded border";
        div.innerHTML = `
            <div>
                <p class="font-bold text-gray-700">Punto: ${c.cobrador_id}</p>
                <p class="text-sm text-gray-500">${c.cantidad_pagos} tickets pendientes</p>
            </div>
            <div class="text-right">
                <p class="text-lg font-bold text-blue-600">$${c.total.toFixed(2)}</p>
                <button onclick="liquidarCaja(${c.cobrador_id}, ${c.total})" 
                        class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                    Liquidar
                </button>
            </div>
        `;
        contenedor.appendChild(div);
    });
}

async function liquidarCaja(id, totalEsperado) {
    const monto = prompt(`¿Cuánto efectivo estás recibiendo del Punto ${id}?`, totalEsperado);
    if (monto !== null) {
        const res = await fetch('/api/liquidar-caja', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                cobradorId: id, 
                montoEntregado: parseFloat(monto),
                observaciones: "Cierre de quincena"
            })
        });
        const data = await res.json();
        alert(data.mensaje);
        cargarResumenCajas(); // Recargar la lista
    }
}

// Llamar al cargar al inicio
cargarResumenCajas();
        async function buscar() {
            const criterio = document.getElementById('inputBusqueda').value;
            const res = await fetch(`/api/buscar?criterio=${criterio}`);
            const clientes = await res.json();
            const formatoMoneda = new Intl.NumberFormat('es-MX', { 
				style: 'currency', 
				currency: 'MXN' 
			});
            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '';

            clientes.forEach(c => {
                const serv = c.domicilios[0].servicios[0];
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500";
                div.innerHTML = `
                    <h3 class="font-bold text-lg">${c.nombre_completo}</h3>
                    <p class="text-gray-600 text-sm">📍 ${c.domicilios[0].direccion_exacta}</p>
                    <p class="text-blue-600 font-mono text-sm">🌐 IP: ${serv.ip_interna}</p>
                    <div class="mt-4 p-3 bg-gray-50 rounded">
                        <span class="text-sm text-gray-500">Mensualidad:</span>
                        <span class="block text-2xl font-bold text-gray-800">${formatoMoneda.format(serv.precio_mensual)}</span>
                    </div>
                    <button onclick="abrirModalPago(${c.id}, ${serv.precio_mensual})" 
                            class="w-full mt-4 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                        Registrar Pago
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        async function abrirModalPago(id, monto) {
    const formatoMoneda = new Intl.NumberFormat('es-MX', { 
        style: 'currency', 
        currency: 'MXN' 
    });

    const confirmacion = confirm(`¿Confirmar cobro de ${formatoMoneda.format(monto)}?`);
    
    if (confirmacion) {
        const res = await fetch('/api/pagar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                clienteId: id, 
                monto: monto, 
                metodo: "Efectivo",
                cobradorId: 100 // Asegúrate de pasar un ID de cobrador válido
            })
        });

        const data = await res.json();
        alert(data.mensaje);

        // ✅ LA CLAVE: Llamamos a la función de mostrar ticket con el ID que nos dio el servidor
        // Como registrarPagosDinamicos devuelve un array, tomamos el primer pago [0]
        if (data.detalle && data.detalle.length > 0) {
            mostrarTicket(data.detalle[0].id);
        } else if (data.detalle && data.detalle.id) {
            mostrarTicket(data.detalle.id);
        }

        buscar(); // Refrescar la lista de atrás
    }
}

// ✅ Función separada (Fuera de abrirModalPago)
async function mostrarTicket(pagoId) {
    const res = await fetch(`/api/ticket/${pagoId}`);
    const pago = await res.json();
    
    const detalle = document.getElementById('detalleTicket');
    // En index.html dentro de mostrarTicket
detalle.innerHTML = `
    <p class="flex justify-between"><span>Folio:</span> <b>#${pago.id}</b></p>
    <p class="flex justify-between"><span>Fecha:</span> <b>${new Date(pago.fecha_pago).toLocaleString()}</b></p>
    <hr class="my-2 border-dashed">
    
    <p class="font-bold text-lg uppercase">${pago.cliente?.nombre_completo || 'CLIENTE DESCONOCIDO'}</p>
    
    <p class="flex justify-between"><span>Mes cubierto:</span> <b>${pago.mes_cubierto}</b></p>
    <hr class="my-2 border-dashed">
    <p class="flex justify-between text-xl font-bold"><span>TOTAL:</span> <span>$${pago.monto}</span></p>
    <p class="mt-4 text-center text-xs text-gray-500 italic">¡Gracias por tu pago!</p>
`;
    document.getElementById('modalTicket').classList.remove('hidden');
}

// ✅ Función separada
function cerrarTicket() {
    document.getElementById('modalTicket').classList.add('hidden');
    // location.reload(); // Opcional: puedes quitarlo si solo quieres ocultar el modal
}
    </script>
</body>
</html>
