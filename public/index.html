<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobros WISP - Punto de Venta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-lg text-center font-bold text-xl">
        📡 ERP-Wisp: Punto de Cobro
    </nav>

    <main class="max-w-md mx-auto p-4">
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <label class="block text-gray-700 font-bold mb-2">Buscar Cliente (Nombre o IP)</label>
            <div class="flex gap-2">
                <input type="text" id="inputBusqueda" placeholder="Ej: 192.168.100..." 
                       class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="buscar()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">🔍</button>
            </div>
        </div>

        <div id="resultados" class="space-y-4">
            </div>
		<div class="mt-10 bg-white p-6 rounded-lg shadow-lg border-t-4 border-blue-600">
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        📊 Resumen de Cajas por Liquidar
    </h2>
    <div id="listaCajas" class="space-y-4">
        </div>
</div>
<div id="modalTicket" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-6 rounded-lg shadow-xl font-mono text-sm">
        <div class="text-center border-b pb-4 mb-4">
            <h2 class="text-xl font-bold">📡 MI WISP</h2>
            <p>Comprobante de Pago</p>
        </div>
        <div id="detalleTicket">
            </div>
        <div class="mt-6 flex gap-2">
            <button onclick="cerrarTicket()" class="flex-1 bg-gray-200 py-2 rounded">Cerrar</button>
            <button onclick="window.print()" class="flex-1 bg-blue-600 text-white py-2 rounded">Imprimir</button>
        </div>
    </div>
</div>
    </main>

    <script>
	async function cargarResumenCajas() {
    const res = await fetch('/api/reporte-liquidaciones');
    const resumen = await res.json();
    const contenedor = document.getElementById('listaCajas');
    contenedor.innerHTML = '';

    resumen.forEach(c => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center p-3 bg-gray-50 rounded border";
        div.innerHTML = `
            <div>
                <p class="font-bold text-gray-700">Punto: ${c.cobrador_id}</p>
                <p class="text-sm text-gray-500">${c.cantidad_pagos} tickets pendientes</p>
            </div>
            <div class="text-right">
                <p class="text-lg font-bold text-blue-600">$${c.total.toFixed(2)}</p>
                <button onclick="liquidarCaja(${c.cobrador_id}, ${c.total})" 
                        class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">
                    Liquidar
                </button>
            </div>
        `;
        contenedor.appendChild(div);
    });
}

async function liquidarCaja(id, totalEsperado) {
    const monto = prompt(`¿Cuánto efectivo estás recibiendo del Punto ${id}?`, totalEsperado);
    if (monto !== null) {
        const res = await fetch('/api/liquidar-caja', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                cobradorId: id, 
                montoEntregado: parseFloat(monto),
                observaciones: "Cierre de quincena"
            })
        });
        const data = await res.json();
        alert(data.mensaje);
        cargarResumenCajas(); // Recargar la lista
    }
}

// Llamar al cargar al inicio
cargarResumenCajas();
        async function buscar() {
            const criterio = document.getElementById('inputBusqueda').value;
            const res = await fetch(`/api/buscar?criterio=${criterio}`);
            const clientes = await res.json();
            const formatoMoneda = new Intl.NumberFormat('es-MX', { 
				style: 'currency', 
				currency: 'MXN' 
			});
            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '';

            clientes.forEach(c => {
                const serv = c.domicilios[0].servicios[0];
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500";
                div.innerHTML = `
                    <h3 class="font-bold text-lg">${c.nombre_completo}</h3>
                    <p class="text-gray-600 text-sm">📍 ${c.domicilios[0].direccion_exacta}</p>
                    <p class="text-blue-600 font-mono text-sm">🌐 IP: ${serv.ip_interna}</p>
                    <div class="mt-4 p-3 bg-gray-50 rounded">
                        <span class="text-sm text-gray-500">Mensualidad:</span>
                        <span class="block text-2xl font-bold text-gray-800">${formatoMoneda.format(serv.precio_mensual)}</span>
                    </div>
                    <button onclick="abrirModalPago(${c.id}, ${serv.precio_mensual})" 
                            class="w-full mt-4 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                        Registrar Pago
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        async function abrirModalPago(id, monto) {
    const formatoMoneda = new Intl.NumberFormat('es-MX', { 
        style: 'currency', 
        currency: 'MXN' 
    });

    const confirmacion = confirm(`¿Confirmar cobro de ${formatoMoneda.format(monto)}?`);
    
    if (confirmacion) {
        const res = await fetch('/api/pagar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                clienteId: id, 
                monto: monto, 
                metodo: "Efectivo",
                cobradorId: 100 // Asegúrate de pasar un ID de cobrador válido
            })
        });

        const data = await res.json();
        alert(data.mensaje);

        // ✅ LA CLAVE: Llamamos a la función de mostrar ticket con el ID que nos dio el servidor
        // Como registrarPagosDinamicos devuelve un array, tomamos el primer pago [0]
        if (data.detalle && data.detalle.length > 0) {
            mostrarTicket(data.detalle[0].id);
        } else if (data.detalle && data.detalle.id) {
            mostrarTicket(data.detalle.id);
        }

        buscar(); // Refrescar la lista de atrás
    }
}

// ✅ Función separada (Fuera de abrirModalPago)
async function mostrarTicket(pagoId) {
    const res = await fetch(`/api/ticket/${pagoId}`);
    const pago = await res.json();
    
    const detalle = document.getElementById('detalleTicket');
    // En index.html dentro de mostrarTicket
detalle.innerHTML = `
    <p class="flex justify-between"><span>Folio:</span> <b>#${pago.id}</b></p>
    <p class="flex justify-between"><span>Fecha:</span> <b>${new Date(pago.fecha_pago).toLocaleString()}</b></p>
    <hr class="my-2 border-dashed">
    
    <p class="font-bold text-lg uppercase">${pago.cliente?.nombre_completo || 'CLIENTE DESCONOCIDO'}</p>
    
    <p class="flex justify-between"><span>Mes cubierto:</span> <b>${pago.mes_cubierto}</b></p>
    <hr class="my-2 border-dashed">
    <p class="flex justify-between text-xl font-bold"><span>TOTAL:</span> <span>$${pago.monto}</span></p>
    <p class="mt-4 text-center text-xs text-gray-500 italic">¡Gracias por tu pago!</p>
`;
    document.getElementById('modalTicket').classList.remove('hidden');
}

// ✅ Función separada
function cerrarTicket() {
    document.getElementById('modalTicket').classList.add('hidden');
    // location.reload(); // Opcional: puedes quitarlo si solo quieres ocultar el modal
}
    </script>
</body>
</html>
